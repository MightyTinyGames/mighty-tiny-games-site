<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mighty Tiny Games</title>
  <meta name="description" content="Mighty Tiny Games is an indie game studio building tiny but mighty PC simulation games.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0e0e0e">
  <link rel="canonical" href="https://mightytinygames.com/">
  <meta property="og:title" content="Mighty Tiny Games">
  <meta property="og:description" content="Indie PC simulation games from a tiny studio with mighty ideas.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mightytinygames.com/">
  <meta property="og:site_name" content="Mighty Tiny Games">
  <meta property="og:image" content="https://mightytinygames.com/assets/Mighty-Tiny-01.svg">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Mighty Tiny Games">
  <meta name="twitter:description" content="Indie PC simulation games from a tiny studio with mighty ideas.">
  <meta name="twitter:image" content="https://mightytinygames.com/assets/Mighty-Tiny-01.svg">
  <link rel="icon" type="image/svg+xml" href="assets/Mighty-Tiny-01.svg">
  <link rel="icon" href="assets/MTG-favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/MTG-favicon-32.png" sizes="32x32">
  <link rel="icon" href="assets/MTG-favicon-16.png" sizes="16x16">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Mighty Tiny Games",
      "url": "https://mightytinygames.com/",
      "logo": "https://mightytinygames.com/assets/Mighty-Tiny-01.svg",
      "sameAs": [
        "https://youtube.com/@mightytinygames"
      ],
      "description": "Mighty Tiny Games is an indie game studio building tiny but mighty PC simulation games."
    }
  </script>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --orange: #c35527;
      --orange-glow: #e0682f;
      --cream: #f5f4f1;
      --dark: #0e0e0e;
      --dark-surface: #161616;
      --dark-card: #1c1c1c;
      --text-muted: #8a8a8a;
    }

    html {
      scroll-behavior: smooth;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--dark);
      color: var(--cream);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* --- Grain overlay --- */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
    }

    /* --- Hero --- */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      position: relative;
    }

    /* Radial glow behind logo */
    .hero::after {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(195, 85, 39, 0.12) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -55%);
      pointer-events: none;
      z-index: 0;
    }

    .logo {
      width: min(420px, 80vw);
      height: auto;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 0 60px rgba(195, 85, 39, 0.15));
      animation: logoFade 1.2s ease-out both;
    }

    @keyframes logoFade {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .tagline {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: var(--text-muted);
      letter-spacing: 0.25em;
      text-transform: uppercase;
	  text-align: center;
      margin-top: 2rem;
      position: relative;
      z-index: 1;
      animation: fadeUp 1s 0.4s ease-out both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .social-links {
      display: flex;
      gap: 1.5rem;
      margin-top: 2.5rem;
      position: relative;
      z-index: 1;
      animation: fadeUp 1s 0.7s ease-out both;
    }

    .social-links a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(245, 244, 241, 0.12);
      color: var(--cream);
      text-decoration: none;
      transition: border-color 0.3s, background 0.3s, transform 0.3s;
    }

    .social-links a:hover {
      border-color: var(--orange);
      background: rgba(195, 85, 39, 0.1);
      transform: translateY(-2px);
    }

    .social-links a svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* --- Divider --- */
    .divider {
      width: 60px;
      height: 2px;
      background: var(--orange);
      margin: 0 auto;
      opacity: 0.6;
    }

    /* --- About section --- */
    .about {
      max-width: 640px;
      margin: 0 auto;
      padding: 6rem 2rem;
      text-align: center;
    }

    .about h2 {
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: var(--cream);
    }

    .about p {
      font-size: 1.05rem;
      line-height: 1.8;
      color: var(--text-muted);
    }

    /* --- Footer --- */
    footer {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid rgba(245, 244, 241, 0.06);
    }

    footer a {
      color: var(--orange);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* --- Scroll indicator --- */
    .scroll-hint {
      position: sticky;
      top: 90vh;
      z-index: 1;
      animation: fadeUp 1s 1s ease-out both;
      transition: opacity 0.3s;
    }

    .scroll-hint svg {
      width: 24px;
      height: 24px;
      stroke: var(--text-muted);
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }

  </style>
</head>
<body>
  <main>
    <section class="hero">
      <h1 class="sr-only">Mighty Tiny Games</h1>
      <img src="assets/Mighty-Tiny-01.svg" alt="Mighty Tiny Games logo" class="logo" width="420" height="420">
      <p class="tagline">Tiny studio<br>Mighty simulations</p>

      <nav class="social-links" aria-label="Social links">
        <a href="https://youtube.com/@mightytinygames" aria-label="Visit Mighty Tiny Games on YouTube" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        </a>
      </nav>
    </section>
  </main>

  <footer>
    &copy; 2026 Mighty Tiny Games. All rights reserved.
  </footer>

</body>
</html>
